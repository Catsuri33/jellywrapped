<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>JellyWrapped</title>
</head>
<body>
    <div id="JellyWrappedConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-checkbox,emby-select">
        <div data-role="content">
            <div class="content-primary">
                <div class="verticalSection">
                    <h2 class="sectionTitle">JellyWrapped</h2>
                    <p><span data-jw="settings.intro">Each user's yearly recap is available at</span>
                        <a id="JellyWrappedAppLink" is="emby-linkbutton" class="button-link" target="_blank" href="#">/JellyWrapped/App/</a>.</p>
                    <p><a is="emby-linkbutton" class="button-link" href="#/configurationpage?name=JellyWrappedUsers" data-jw="settings.usersLink">See every user's Wrapped</a></p>
                    <p id="JellyWrappedInjection" class="fieldDescription"></p>
                </div>

                <form id="JellyWrappedConfigForm">
                    <h3 data-jw="settings.tracking">Tracking</h3>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="MinAudioSeconds" data-jw="settings.minAudio">Minimum listening time for a track (seconds)</label>
                        <input id="MinAudioSeconds" type="number" is="emby-input" min="0" />
                        <div class="fieldDescription" data-jw="settings.minAudioHelp">Below this, the track counts as skipped and is not recorded.</div>
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="MinVideoSeconds" data-jw="settings.minVideo">Minimum watching time for a video (seconds)</label>
                        <input id="MinVideoSeconds" type="number" is="emby-input" min="0" />
                    </div>
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input id="IncludeEstimatedHistory" type="checkbox" is="emby-checkbox" />
                            <span data-jw="settings.estimates">Estimate earlier history</span>
                        </label>
                        <div class="fieldDescription checkboxFieldDescription" data-jw="settings.estimatesHelp"></div>
                    </div>

                    <h3 data-jw="settings.recap">Recap</h3>
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input id="ShowServerComparison" type="checkbox" is="emby-checkbox" />
                            <span data-jw="settings.comparison">Compare with other users</span>
                        </label>
                        <div class="fieldDescription checkboxFieldDescription" data-jw="settings.comparisonHelp"></div>
                    </div>
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input id="AllowPublicSharing" type="checkbox" is="emby-checkbox" />
                            <span data-jw="settings.sharing">Allow public share links</span>
                        </label>
                        <div class="fieldDescription checkboxFieldDescription" data-jw="settings.sharingHelp"></div>
                    </div>
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input id="InjectWebLink" type="checkbox" is="emby-checkbox" />
                            <span data-jw="settings.webLink">Add "My Wrapped" to the Jellyfin menu</span>
                        </label>
                        <div class="fieldDescription checkboxFieldDescription" data-jw="settings.webLinkHelp"></div>
                    </div>

                    <h3 data-jw="settings.banner">Home banner</h3>
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input id="ShowHomeBanner" type="checkbox" is="emby-checkbox" />
                            <span data-jw="settings.showBanner">Announce the recap on the home page</span>
                        </label>
                        <div class="fieldDescription checkboxFieldDescription" data-jw="settings.showBannerHelp"></div>
                    </div>
                    <div style="display:flex;gap:1em;flex-wrap:wrap">
                        <div class="inputContainer" style="flex:1;min-width:8em">
                            <label class="inputLabel inputLabelUnfocused" for="BannerStartDay" data-jw="settings.fromDay">From (day)</label>
                            <input id="BannerStartDay" type="number" is="emby-input" min="1" max="31" />
                        </div>
                        <div class="selectContainer" style="flex:2;min-width:10em">
                            <label class="selectLabel" for="BannerStartMonth" data-jw="settings.month">Month</label>
                            <select is="emby-select" id="BannerStartMonth" class="emby-select-withcolor emby-select jellywrapped-month"></select>
                        </div>
                        <div class="inputContainer" style="flex:1;min-width:8em">
                            <label class="inputLabel inputLabelUnfocused" for="BannerEndDay" data-jw="settings.toDay">To (day)</label>
                            <input id="BannerEndDay" type="number" is="emby-input" min="1" max="31" />
                        </div>
                        <div class="selectContainer" style="flex:2;min-width:10em">
                            <label class="selectLabel" for="BannerEndMonth" data-jw="settings.month">Month</label>
                            <select is="emby-select" id="BannerEndMonth" class="emby-select-withcolor emby-select jellywrapped-month"></select>
                        </div>
                    </div>
                    <div id="JellyWrappedBannerHint" class="fieldDescription" style="margin-bottom:1.5em"></div>
                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                            <span data-jw="settings.save">Save</span>
                        </button>
                    </div>
                </form>

                <div class="verticalSection" style="margin-top:2em">
                    <h3 data-jw="settings.history">History</h3>
                    <div id="JellyWrappedStatus" class="fieldDescription" data-jw="settings.loading">Loading…</div>
                    <p data-jw-html="settings.importHelp"></p>
                    <button is="emby-button" type="button" id="JellyWrappedImport" class="raised emby-button">
                        <span data-jw="settings.importButton">Import from Playback Reporting</span>
                    </button>
                    <div id="JellyWrappedImportResult" class="fieldDescription"></div>
                </div>
            </div>
        </div>
        <script type="text/javascript">
            (function () {
                var pluginId = '8f868969-3282-4493-878a-3e89e2f79d3a';
                var page = document.querySelector('#JellyWrappedConfigPage');
                var booleans = ['IncludeEstimatedHistory', 'ShowServerComparison', 'AllowPublicSharing', 'InjectWebLink', 'ShowHomeBanner'];
                var numbers = ['MinAudioSeconds', 'MinVideoSeconds', 'BannerStartDay', 'BannerStartMonth', 'BannerEndDay', 'BannerEndMonth'];
                var t = function (key) { return key; };
                var locale;

                // Loads the plugin translations and applies them to the [data-jw] elements.
                function translate() {
                    var ready = window.JellyWrappedI18n ? Promise.resolve() : new Promise(function (resolve, reject) {
                        var tag = document.createElement('script');
                        tag.src = ApiClient.getUrl('JellyWrapped/App/i18n.js');
                        tag.onload = resolve;
                        tag.onerror = reject;
                        document.head.appendChild(tag);
                    });
                    return ready.then(function () {
                        return window.JellyWrappedI18n.load(ApiClient.getCurrentUserId());
                    }).then(function (i18n) {
                        t = i18n.t;
                        locale = i18n.locale;
                        page.querySelectorAll('[data-jw]').forEach(function (el) { el.textContent = t(el.getAttribute('data-jw')); });
                        page.querySelectorAll('[data-jw-html]').forEach(function (el) { el.innerHTML = t(el.getAttribute('data-jw-html')); });
                        fillMonths();
                    });
                }

                function fillMonths() {
                    page.querySelectorAll('.jellywrapped-month').forEach(function (select) {
                        var selected = select.value;
                        select.innerHTML = '';
                        for (var m = 1; m <= 12; m++) {
                            var option = document.createElement('option');
                            option.value = m;
                            option.textContent = new Date(2000, m - 1, 1).toLocaleDateString(locale, { month: 'long' });
                            select.appendChild(option);
                        }

                        if (selected) {
                            select.value = selected;
                        }
                    });
                }

                fillMonths();

                function value(id) {
                    return parseInt(page.querySelector('#' + id).value, 10) || 1;
                }

                function updateBannerHint() {
                    var start = value('BannerStartMonth') * 100 + value('BannerStartDay');
                    var end = value('BannerEndMonth') * 100 + value('BannerEndDay');
                    page.querySelector('#JellyWrappedBannerHint').textContent = t(start > end ? 'settings.bannerWraps' : 'settings.bannerSameYear');
                }

                numbers.forEach(function (key) { page.querySelector('#' + key).addEventListener('change', updateBannerHint); });

                function loadStatus() {
                    ApiClient.getJSON(ApiClient.getUrl('JellyWrapped/Status')).then(function (status) {
                        var lines = [t('settings.trackingSince', { date: new Date(status.TrackingSinceUtc).toLocaleString(locale) })];
                        var years = Object.keys(status.PlaysByYear);
                        years.forEach(function (y) {
                            lines.push(t('settings.playsInYear', { year: y, plays: status.PlaysByYear[y] }));
                        });
                        if (!years.length) {
                            lines.push(t('settings.noPlays'));
                        }

                        var box = page.querySelector('#JellyWrappedStatus');
                        box.innerHTML = '';
                        lines.forEach(function (line) {
                            var row = document.createElement('div');
                            row.textContent = line;
                            box.appendChild(row);
                        });
                        page.querySelector('#JellyWrappedInjection').textContent = t(status.WebLinkInjected ? 'settings.injected' : 'settings.notInjected');
                    });
                }

                page.addEventListener('pageshow', function () {
                    var link = page.querySelector('#JellyWrappedAppLink');
                    link.href = ApiClient.getUrl('JellyWrapped/App/');
                    link.textContent = link.href;

                    Dashboard.showLoadingMsg();
                    translate().catch(function () { /* Keep the English defaults. */ }).then(function () {
                        return ApiClient.getPluginConfiguration(pluginId);
                    }).then(function (config) {
                        booleans.forEach(function (key) { page.querySelector('#' + key).checked = config[key]; });
                        numbers.forEach(function (key) { page.querySelector('#' + key).value = config[key]; });
                        updateBannerHint();
                        loadStatus();
                        Dashboard.hideLoadingMsg();
                    });
                });

                page.querySelector('#JellyWrappedConfigForm').addEventListener('submit', function (e) {
                    e.preventDefault();
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                        booleans.forEach(function (key) { config[key] = page.querySelector('#' + key).checked; });
                        numbers.forEach(function (key) { config[key] = parseInt(page.querySelector('#' + key).value, 10) || 0; });
                        ApiClient.updatePluginConfiguration(pluginId, config).then(function (result) {
                            Dashboard.processPluginConfigurationUpdateResult(result);
                        });
                    });
                    return false;
                });

                page.querySelector('#JellyWrappedImport').addEventListener('click', function () {
                    var result = page.querySelector('#JellyWrappedImportResult');
                    var button = this;
                    button.disabled = true;
                    result.textContent = t('settings.importReading');

                    ApiClient.ajax({
                        type: 'POST',
                        url: ApiClient.getUrl('user_usage_stats/submit_custom_query'),
                        data: JSON.stringify({
                            CustomQueryString: 'SELECT DateCreated, UserId, ItemId, PlayDuration FROM PlaybackActivity',
                            ReplaceUserId: false
                        }),
                        contentType: 'application/json',
                        dataType: 'json'
                    }).then(function (data) {
                        var cols = data.colums || [];
                        var rows = (data.results || []).map(function (row) {
                            var o = {};
                            cols.forEach(function (c, i) { o[c] = row[i]; });
                            return { DateCreated: String(o.DateCreated), UserId: String(o.UserId), ItemId: String(o.ItemId), PlayDuration: parseInt(o.PlayDuration, 10) || 0 };
                        });
                        var imported = 0;
                        var chunks = [];
                        for (var i = 0; i < rows.length; i += 2000) {
                            chunks.push(rows.slice(i, i + 2000));
                        }

                        return chunks.reduce(function (promise, chunk, index) {
                            return promise.then(function () {
                                result.textContent = t('settings.importProgress', { n: Math.round(index / chunks.length * 100) });
                                return ApiClient.ajax({
                                    type: 'POST',
                                    url: ApiClient.getUrl('JellyWrapped/Import/PlaybackReporting'),
                                    data: JSON.stringify(chunk),
                                    contentType: 'application/json',
                                    dataType: 'json'
                                }).then(function (r) { imported += r.Imported; });
                            });
                        }, Promise.resolve()).then(function () {
                            result.textContent = t('settings.importDone', { imported: imported, total: rows.length });
                            loadStatus();
                        });
                    }).catch(function () {
                        result.textContent = t('settings.importFailed');
                    }).finally(function () {
                        button.disabled = false;
                    });
                });
            })();
        </script>
    </div>
</body>
</html>
