<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Users' Wrapped</title>
</head>
<body>
    <div id="JellyWrappedUsersPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-button,emby-select">
        <style>
            #JellyWrappedUsersPage .jw-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 1em; margin-bottom: 1.5em; }
            #JellyWrappedUsersPage .jw-head h2 { margin: 0; }
            #JellyWrappedUsersPage .jw-tools { display: flex; align-items: flex-end; gap: 1em; }
            #JellyWrappedUsersPage .jw-tools .selectContainer { margin: 0; min-width: 8em; }
            #JellyWrappedUsersPage .jw-summary { display: flex; flex-wrap: wrap; gap: 2.5em; margin-bottom: 1.5em; opacity: .9; }
            #JellyWrappedUsersPage .jw-summary b { display: block; font-size: 1.8em; }
            #JellyWrappedUsersPage .jw-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1em; }
            #JellyWrappedUsersPage .jw-card { border-radius: 12px; padding: 1.1em 1.2em; background: linear-gradient(150deg, rgba(170, 92, 195, .28), rgba(0, 164, 220, .18)); display: flex; flex-direction: column; gap: .6em; }
            #JellyWrappedUsersPage .jw-card.empty { background: rgba(127, 127, 127, .12); opacity: .7; }
            #JellyWrappedUsersPage .jw-name { font-weight: 700; font-size: 1.15em; display: flex; justify-content: space-between; gap: .5em; }
            #JellyWrappedUsersPage .jw-persona { font-weight: 400; font-size: .85em; opacity: .85; white-space: nowrap; }
            #JellyWrappedUsersPage .jw-minutes { font-size: 2em; font-weight: 800; line-height: 1; }
            #JellyWrappedUsersPage .jw-minutes small { font-size: .45em; font-weight: 400; opacity: .8; }
            #JellyWrappedUsersPage .jw-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: rgba(127, 127, 127, .25); }
            #JellyWrappedUsersPage .jw-legend { display: flex; gap: 1em; font-size: .8em; opacity: .85; }
            #JellyWrappedUsersPage .jw-legend i { display: inline-block; width: .7em; height: .7em; border-radius: 50%; margin-right: .3em; }
            #JellyWrappedUsersPage .jw-tops { font-size: .9em; line-height: 1.6; }
            #JellyWrappedUsersPage .jw-tops div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            #JellyWrappedUsersPage .jw-tops span { opacity: .7; }
            #JellyWrappedUsersPage .jw-card .emby-button { margin: .4em 0 0; }
        </style>
        <div data-role="content">
            <div class="content-primary">
                <div class="jw-head">
                    <div>
                        <h2 data-jw="users.title">Users' Wrapped</h2>
                        <a id="JellyWrappedSettingsLink" is="emby-linkbutton" class="button-link" href="#" data-jw="users.settingsLink">JellyWrapped settings</a>
                    </div>
                    <div class="jw-tools">
                        <div class="selectContainer">
                            <label class="selectLabel" for="JellyWrappedYear" data-jw="users.year">Year</label>
                            <select is="emby-select" id="JellyWrappedYear" class="emby-select-withcolor emby-select"></select>
                        </div>
                    </div>
                </div>
                <div id="JellyWrappedSummary" class="jw-summary"></div>
                <div id="JellyWrappedGrid" class="jw-grid"></div>
                <p class="fieldDescription" data-jw="users.help"></p>
            </div>
        </div>
        <script type="text/javascript">
            (function () {
                var page = document.querySelector('#JellyWrappedUsersPage');
                var yearSelect = page.querySelector('#JellyWrappedYear');
                var tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
                var nf = new Intl.NumberFormat();
                var t = function (key) { return key; };
                var emojis = {
                    'binge-watcher': '🍿', 'night-owl': '🦉', 'early-bird': '🌅', 'explorer': '🧭', 'music-lover': '🎧',
                    'cinephile': '🎬', 'series-addict': '📺', 'weekend-warrior': '🛋️', 'eclectic': '🌈'
                };
                var colors = { MusicMinutes: '#f72585', MovieMinutes: '#fb8500', SeriesMinutes: '#00bbf9' };
                var labels = { MusicMinutes: 'users.music', MovieMinutes: 'users.movies', SeriesMinutes: 'users.series' };

                // Loads the plugin translations and applies them to the [data-jw] elements.
                function translate() {
                    var ready = window.JellyWrappedI18n ? Promise.resolve() : new Promise(function (resolve, reject) {
                        var tag = document.createElement('script');
                        tag.src = ApiClient.getUrl('JellyWrapped/App/i18n.js');
                        tag.onload = resolve;
                        tag.onerror = reject;
                        document.head.appendChild(tag);
                    });
                    return ready.then(function () {
                        return window.JellyWrappedI18n.load(ApiClient.getCurrentUserId());
                    }).then(function (i18n) {
                        t = i18n.t;
                        nf = i18n.numbers;
                        page.querySelectorAll('[data-jw]').forEach(function (node) { node.textContent = t(node.getAttribute('data-jw')); });
                    });
                }

                function el(tag, className, text) {
                    var node = document.createElement(tag);
                    if (className) {
                        node.className = className;
                    }

                    if (text !== undefined) {
                        node.textContent = text;
                    }

                    return node;
                }

                function top(labelKey, value) {
                    var row = el('div');
                    row.appendChild(el('span', '', t('users.labelFormat', { label: t(labelKey) })));
                    row.appendChild(document.createTextNode(value));
                    row.title = value;
                    return row;
                }

                function card(user, year) {
                    var c = el('div', 'jw-card' + (user.HasData ? '' : ' empty'));
                    var name = el('div', 'jw-name');
                    name.appendChild(el('span', '', user.UserName));
                    if (user.HasData && emojis[user.Persona]) {
                        name.appendChild(el('span', 'jw-persona', emojis[user.Persona] + ' ' + t('personas.' + user.Persona + '.0')));
                    }

                    c.appendChild(name);
                    if (!user.HasData) {
                        c.appendChild(el('div', '', t('users.noPlays', { year: String(year) })));
                        return c;
                    }

                    var totals = user.Totals;
                    var minutes = el('div', 'jw-minutes', nf.format(totals.Minutes) + ' ');
                    minutes.appendChild(el('small', '', t('users.minutesAndPlays', { plays: totals.Plays })));
                    c.appendChild(minutes);

                    var bar = el('div', 'jw-bar');
                    var legend = el('div', 'jw-legend');
                    Object.keys(colors).forEach(function (key) {
                        if (totals[key] > 0) {
                            var share = totals[key] / Math.max(1, totals.Minutes) * 100;
                            var part = el('div');
                            part.style.width = share + '%';
                            part.style.background = colors[key];
                            bar.appendChild(part);
                            var item = el('span');
                            var dot = el('i');
                            dot.style.background = colors[key];
                            item.appendChild(dot);
                            item.appendChild(document.createTextNode(t(labels[key]) + ' ' + t('users.percent', { n: Math.round(share) })));
                            legend.appendChild(item);
                        }
                    });
                    c.appendChild(bar);
                    c.appendChild(legend);

                    var tops = el('div', 'jw-tops');
                    [['TopArtist', 'users.artist'], ['TopTrack', 'users.track'], ['TopMovie', 'users.movie'], ['TopSeries', 'users.show']].forEach(function (entry) {
                        if (user[entry[0]]) {
                            tops.appendChild(top(entry[1], user[entry[0]]));
                        }
                    });
                    c.appendChild(tops);

                    var info = [];
                    if (user.ContainsEstimates) {
                        info.push(t('users.estimates'));
                    }

                    if (user.Shared) {
                        info.push(t('users.shared'));
                    }

                    if (info.length) {
                        c.appendChild(el('div', 'fieldDescription', info.join(' · ')));
                    }

                    var link = el('a', 'raised emby-button', t('users.view'));
                    link.href = ApiClient.getUrl('JellyWrapped/App/') + '?user=' + encodeURIComponent(user.UserId) + '&year=' + year;
                    link.target = '_blank';
                    link.rel = 'noopener';
                    c.appendChild(link);
                    return c;
                }

                function load(year) {
                    Dashboard.showLoadingMsg();
                    var params = { tz: tz };
                    if (year) {
                        params.year = year;
                    }

                    ApiClient.getJSON(ApiClient.getUrl('JellyWrapped/Admin/Users', params)).then(function (data) {
                        yearSelect.innerHTML = '';
                        data.Years.forEach(function (y) {
                            var option = el('option', '', String(y));
                            option.value = y;
                            yearSelect.appendChild(option);
                        });
                        yearSelect.value = data.Year;

                        var active = data.Users.filter(function (u) { return u.HasData; });
                        var total = active.reduce(function (sum, u) { return sum + u.Totals.Minutes; }, 0);
                        var summary = page.querySelector('#JellyWrappedSummary');
                        summary.innerHTML = '';
                        [[nf.format(total), t('users.serverMinutes')], [active.length + ' / ' + data.Users.length, t('users.activeUsers')]].forEach(function (s) {
                            var block = el('div');
                            block.appendChild(el('b', '', s[0]));
                            block.appendChild(document.createTextNode(s[1]));
                            summary.appendChild(block);
                        });

                        var grid = page.querySelector('#JellyWrappedGrid');
                        grid.innerHTML = '';
                        data.Users
                            .slice()
                            .sort(function (a, b) { return (b.HasData ? b.Totals.Minutes : -1) - (a.HasData ? a.Totals.Minutes : -1); })
                            .forEach(function (user) { grid.appendChild(card(user, data.Year)); });
                        Dashboard.hideLoadingMsg();
                    }).catch(function () {
                        Dashboard.hideLoadingMsg();
                        page.querySelector('#JellyWrappedGrid').textContent = t('users.error');
                    });
                }

                yearSelect.addEventListener('change', function () { load(yearSelect.value); });

                page.addEventListener('pageshow', function () {
                    page.querySelector('#JellyWrappedSettingsLink').href = '#/configurationpage?name=JellyWrapped';
                    translate().catch(function () { /* Keep the English defaults. */ }).then(function () {
                        load(yearSelect.value || null);
                    });
                });
            })();
        </script>
    </div>
</body>
</html>
